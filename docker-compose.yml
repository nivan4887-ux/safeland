services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - safeland_mongo:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - safeland_redis:/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: safeland
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis

volumes:
  safeland_mongo:
  safeland_redis:
